name: flowforge

services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/workflow_platform.db
    volumes:
      - db_data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    command: >
      sh -c "echo '' &&
             echo '  FlowForge is ready at http://localhost:3000' &&
             echo '' &&
             nginx -g 'daemon off;'"

volumes:
  db_data:
